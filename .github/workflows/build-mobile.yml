name: Build Mobile Apps

on:
  push:
    branches: [ sms4 ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Android Dependencies
        working-directory: ./SMS-Android
        run: npm install

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.0.1

      # Note: This step requires a full Android project structure
      - name: Build Android Release APK
        working-directory: ./SMS-Android
        run: |
          if [ -d "android" ]; then
            cd android
            gradle assembleRelease
          else
            echo "Android native folder not found. Skipping native build."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: SMS-Android/android/app/build/outputs/apk/release/*.apk
        if: success()

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install iOS Dependencies
        working-directory: ./SMS-iOS
        run: npm install

      # Note: This step requires a full iOS project structure and Pods
      - name: Install CocoaPods
        working-directory: ./SMS-iOS
        run: |
          if [ -d "ios" ]; then
            cd ios
            # More aggressive boost fix for CI
            export BOOST_URL="https://boostorg.jfrog.io/artifactory/main/release/1.76.0/source/boost_1_76_0.tar.bz2"
            mkdir -p ~/.cocoapods/repos/trunk/Specs/b/o/o/boost/1.76.0/
            # Clear caches
            pod cache clean --all
            rm -rf Pods
            pod install
          else
            echo "iOS native folder not found. Skipping pod install."
          fi
        if: success()

      - name: Build iOS App
        working-directory: ./SMS-iOS
        run: |
          if [ -d "ios" ]; then
            # Using project instead of workspace if workspace doesn't exist yet
            if [ -d "ios/PhilmoreSMS.xcworkspace" ]; then
              xcodebuild -workspace ios/PhilmoreSMS.xcworkspace -scheme PhilmoreSMS -sdk iphoneos -configuration Release build
            else
              xcodebuild -project ios/PhilmoreSMS.xcodeproj -scheme PhilmoreSMS -sdk iphoneos -configuration Release build
            fi
          else
            echo "iOS native folder not found. Skipping native build."
          fi
        if: success()
