name: Build Mobile Apps

on:
  push:
    branches: [ sms4 ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Android Dependencies
        working-directory: ./SMS-Android
        run: npm install

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      # Note: This step requires a full Android project structure
      - name: Build Android Release APK
        working-directory: ./SMS-Android
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            echo "Android native folder not found. Skipping native build."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-release-apk
          path: SMS-Android/android/app/build/outputs/apk/release/*.apk
        if: success()

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install iOS Dependencies
        working-directory: ./SMS-iOS
        run: npm install

      # Note: This step requires a full iOS project structure and Pods
      - name: Install CocoaPods
        working-directory: ./SMS-iOS/ios
        run: |
          if [ -d "ios" ]; then
            pod install
          else
            echo "iOS native folder not found. Skipping pod install."
          fi
        if: success()

      - name: Build iOS App
        working-directory: ./SMS-iOS
        run: |
          if [ -d "ios" ]; then
            xcodebuild -workspace ios/SMSApp.xcworkspace -scheme SMSApp -sdk iphoneos -configuration Release build
          else
            echo "iOS native folder not found. Skipping native build."
          fi
        if: success()
